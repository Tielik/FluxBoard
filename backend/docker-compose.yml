version: '3.8'

services:
  # Baza SQL do danych użytkowników
  postgres:
    image: postgres:16-alpine
    container_name: continuum-postgres
    environment:
      POSTGRES_DB: continuum
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Baza NoSQL do kształtów (Infinite Canvas)
  mongo:
    image: mongo:7.0
    container_name: continuum-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Broker wiadomości / Cache
  redis:
    image: redis:7-alpine
    container_name: continuum-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  mongo_data:
